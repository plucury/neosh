name: build-release-artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bin neosh --bin neoshd

      - name: Resolve platform suffix
        id: vars
        shell: bash
        run: |
          arch="$(uname -m)"
          case "${{ runner.os }}" in
            Linux) os_name="linux" ;;
            macOS) os_name="macos" ;;
            *) os_name="$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')" ;;
          esac
          case "$arch" in
            x86_64|amd64) arch_name="x86_64" ;;
            arm64|aarch64) arch_name="arm64" ;;
            *) arch_name="$arch" ;;
          esac
          echo "suffix=${os_name}-${arch_name}" >> "$GITHUB_OUTPUT"

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/release/neosh "dist/neosh-${{ steps.vars.outputs.suffix }}"
          cp target/release/neoshd "dist/neoshd-${{ steps.vars.outputs.suffix }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neosh-release-${{ steps.vars.outputs.suffix }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  build-ios-client-c-lib:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Add iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build iOS static libraries
        run: |
          cargo build --release --manifest-path ffi/neosh-client-c/Cargo.toml --target-dir target/ffi-client-c --target aarch64-apple-ios
          cargo build --release --manifest-path ffi/neosh-client-c/Cargo.toml --target-dir target/ffi-client-c --target aarch64-apple-ios-sim

      - name: Create XCFramework
        run: |
          mkdir -p dist
          xcodebuild -create-xcframework \
            -library target/ffi-client-c/aarch64-apple-ios/release/libneosh_client_c.a -headers ffi/neosh-client-c/include \
            -library target/ffi-client-c/aarch64-apple-ios-sim/release/libneosh_client_c.a -headers ffi/neosh-client-c/include \
            -output dist/neosh_client.xcframework
          ditto -c -k --sequesterRsrc --keepParent dist/neosh_client.xcframework dist/neosh_client.xcframework.zip

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: neosh-client-c-ios-xcframework
          path: dist/neosh_client.xcframework.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-cli
      - build-ios-client-c-lib
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: neosh-release-*
          merge-multiple: true

      - name: Download iOS client C artifact
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          name: neosh-client-c-ios-xcframework

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/neosh-*
            release-assets/neoshd-*
            release-assets/neosh_client.xcframework.zip
