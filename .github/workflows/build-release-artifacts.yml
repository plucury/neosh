name: build-release-artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bin neosh --bin neoshd

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/release/neosh dist/neosh-linux-x86_64
          cp target/release/neoshd dist/neoshd-linux-x86_64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neosh-release-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/neosh-linux-x86_64
            dist/neoshd-linux-x86_64
