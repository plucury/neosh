[package]
name = "neosh_client_c"
version = "0.1.0"
edition = "2024"

[lib]
name = "neosh_client_c"
crate-type = ["staticlib"]

[dependencies]
neoshd = { path = "../.." }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "platform-verifier", "rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "io-util"] }
