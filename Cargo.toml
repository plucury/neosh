[package]
name = "neoshd"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
portable-pty = "0.9"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "platform-verifier", "rustls-aws-lc-rs"] }
rand = "0.8"
rcgen = "0.13"
rustls-pemfile = "2.2"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.5"
thiserror = "2.0"
tokio = { version = "1.38", features = ["full"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
